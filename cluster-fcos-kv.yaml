
# envsubst < templates/cluster-template-lb-flatcar.yaml | kubectl apply -f -

---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: "cluster"
  namespace: "default"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.243.0.0/16
    services:
      cidrBlocks:
        - 10.95.0.0/16
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: KubevirtCluster
    name: 'cluster'
    namespace: "default"
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: 'cluster-control-plane'
    namespace: "default"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtCluster
metadata:
  name: "cluster"
  namespace: "default"
spec:
  controlPlaneServiceTemplate:
    spec:
      type: LoadBalancer
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: "cluster-control-plane-v1.32"
  namespace: "default"
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: ssh
      virtualMachineTemplate:
        metadata:
          namespace: "default"
        spec:
          instancetype:
            kind: VirtualMachineClusterInstancetype
            name: "u1.large"
          runStrategy: Always
          template:
            spec:
              domain:
                devices:
                  networkInterfaceMultiqueue: true
                  disks:
                    - disk:
                        bus: virtio
                      name: containervolume
              evictionStrategy: External
              volumes:
                - containerDisk:
                    image: "quay.io/fedora/fedora-coreos-kubevirt:stable"
                  name: containervolume
---
kind: KubeadmControlPlane
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
metadata:
  name: "cluster-control-plane"
  namespace: "default"
spec:
  replicas: 1
  machineTemplate:
    infrastructureRef:
      kind: KubevirtMachineTemplate
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      name: "cluster-control-plane-v1.32"
      namespace: "default"
  kubeadmConfigSpec:
    format: ignition
    files: []
    ignition:
      containerLinuxConfig:
        additionalConfig: |
          passwd:
            users:
              - name: core
                ssh_authorized_keys: [ "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPSVGDGfLui5gsggJkUsaE2kiJWj++AyQMtY0NA5+3Sl afrosi@afrosi-thinkpadp1gen5.rmtde.csb" ]
                password_hash: "$6$rounds=4096$saltsaltsalt$L9mjzQsMjKAfgb7OQEDbkMy/lYKAeGZI8fGWkw1R3ER7B2G2CIHnqfw1NhbPjBaBCe1PJeNn4gL7aYc2MqSJR1"
          storage:
            directories:
              - path: /etc/sysupdate.d
              - path: /var/lib/extensions
              - path: /var/lib/extensions.d
            files:
              - path: "/var/lib/extensions.d/kubernetes-cri-o-1.32-1.32.3-1.fc41-41-x86-64.raw"
                contents:
                  source: "https://extensions.fcos.fr/extensions/kubernetes-cri-o-1.32/kubernetes-cri-o-1.32-1.32.3-1.fc41-41-x86-64.raw"
              - path: "/etc/sysctl.d/kubernetes.conf"
                contents:
                  inline: |
                    net.ipv4.ip_forward = 1
              - path: "/etc/modules-load.d/kubernetes.conf"
                contents:
                  inline: |
                    br_netfilter
              - path: "/etc/hostname"
                contents:
                  inline: |
                    fcos-kube-cp-1
              - path: "/etc/sysconfig/crio"
                contents:
                  inline: |
                    # Setup default CRI-O config from the sysext
                    CRIO_CONFIG_OPTIONS="--config /usr/etc/crio/crio.conf"
            links:
              - path: "/var/lib/extensions/kubernetes-cri-o-1.32.raw"
                target: "../extensions.d/kubernetes-cri-o-1.32-1.32.3-1.fc41-41-x86-64.raw"
                hard: false
          systemd:
            units:
              # Setup sysexts
              - name: systemd-sysext.service
                enabled: true
              # We will use CRI-O
              - name: docker.socket
                enabled: false
                mask: true
              # Enable CRI-O
              - name: crio.service
                enabled: true
              # Enable kubelet
              - name: kubelet.service
                enabled: true
              # Disable auto-updates via Zincati for now (see fleetlock)
              - name: zincati.service
                enabled: false
                mask: true
    # The CAPK automatic SSH key authorization doesn't work for Ignition as it assumes cloud-init
    # is used. We need to explicitly add a key to be able to SSH into cluster nodes.
    users:
    - name: core
      sshAuthorizedKeys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPSVGDGfLui5gsggJkUsaE2kiJWj++AyQMtY0NA5+3Sl afrosi@afrosi-thinkpadp1gen5.rmtde.csb
    clusterConfiguration:
      networking:
        dnsDomain: "cluster.default.local"
        podSubnet: 10.243.0.0/16
        serviceSubnet: 10.95.0.0/16
    initConfiguration:
      nodeRegistration:
        criSocket: /var/run/containerd/containerd.sock
    joinConfiguration:
      nodeRegistration:
        criSocket: /var/run/containerd/containerd.sock
  version: "v1.32.0"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: KubevirtMachineTemplate
metadata:
  name: "cluster-md-0-v1.32"
  namespace: "default"
spec:
  template:
    spec:
      virtualMachineBootstrapCheck:
        checkStrategy: ssh
      virtualMachineTemplate:
        metadata:
          namespace: "default"
          labels:
            app: cluster-md-0-v1.32
        spec:
          instancetype:
            kind: VirtualMachineClusterInstancetype
            name: "u1.large"
          runStrategy: Always
          template:
            metadata:
              labels:
                app: cluster-md-0-v1.32
            spec:
              affinity:
                podAntiAffinity: ## set the anti-affinity rule to spread the pods across nodes
                  preferredDuringSchedulingIgnoredDuringExecution: ## pods will be scheduled on the same node if number if nodes are not matching the number of replicas
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                        - key: app
                          operator: In
                          values:
                          - cluster-md-0-v1.32
                      topologyKey: kubernetes.io/hostname   
              domain:
                devices:
                  networkInterfaceMultiqueue: true
                  disks:
                    - disk:
                        bus: virtio
                      name: containervolume
              evictionStrategy: External
              volumes:
                - containerDisk:
                    image: "quay.io/fedora/fedora-coreos-kubevirt:stable"
                  name: containervolume
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: "cluster-md-0"
  namespace: "default"
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs: {}
      files: []
      format: ignition
      ignition:
        containerLinuxConfig:
          additionalConfig: |
            systemd:
              units:
              - name: kubeadm.service
                enabled: true
                dropins:
                - name: 10-flatcar.conf
                  contents: |
                    [Unit]
                    Requires=containerd.service
                    After=containerd.service
      # The CAPK automatic SSH key authorization doesn't work for Ignition as it assumes cloud-init
      # is used. We need to explicitly add a key to be able to SSH into cluster nodes.
      users:
      - name: core
        sshAuthorizedKeys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPSVGDGfLui5gsggJkUsaE2kiJWj++AyQMtY0NA5+3Sl afrosi@afrosi-thinkpadp1gen5.rmtde.csb
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: "cluster-md-0"
  namespace: "default"
spec:
  clusterName: "cluster"
  replicas: 0 # TODO: for now deploy on the control plane
  selector:
    matchLabels:
  template:
    metadata:
      labels:
        node-role.kubernetes.io/worker: ''
    spec:
      clusterName: "cluster"
      version: "v1.32.0"
      bootstrap:
        configRef:
          name: "cluster-md-0"
          namespace: "default"
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
      infrastructureRef:
        name: "cluster-md-0-v1.32"
        namespace: "default"
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: KubevirtMachineTemplate
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: cluster-control-plane
  namespace: "default"
spec:
  clusterName: cluster
  maxUnhealthy: 40%
  nodeStartupTimeout: 10m
  selector:
    matchLabels:
      cluster.x-k8s.io/control-plane-name: cluster-control-plane
  unhealthyConditions:
  - type: Ready
    status: Unknown
    timeout: 300s
  - type: Ready
    status: "False"
    timeout: 300s
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: cluster-md-0
  namespace: "default"
spec:
  clusterName: cluster
  maxUnhealthy: 100%
  nodeStartupTimeout: 10m
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: cluster-md-0
  unhealthyConditions:
  - type: Ready
    status: Unknown
    timeout: 300s
  - type: Ready
    status: "False"
    timeout: 300s
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    capk.cluster.x-k8s.io/template-kind: extra-resource
    cluster.x-k8s.io/cluster-name: cluster
  name: cloud-controller-manager
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    capk.cluster.x-k8s.io/template-kind: extra-resource
    cluster.x-k8s.io/cluster-name: cluster
  name: kccm
  namespace: default
rules:
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachines
  verbs:
  - get
  - watch
  - list
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachineinstances
  verbs:
  - get
  - watch
  - list
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    capk.cluster.x-k8s.io/template-kind: extra-resource
    cluster.x-k8s.io/cluster-name: cluster
  name: kccm-sa
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kccm
subjects:
- kind: ServiceAccount
  name: cloud-controller-manager
  namespace: default
---
apiVersion: v1
data:
  cloud-config: |
    loadBalancer:
      creationPollInterval: 5
      creationPollTimeout: 60
    namespace: default
    instancesV2:
      enabled: true
      zoneAndRegionEnabled: false
kind: ConfigMap
metadata:
  labels:
    capk.cluster.x-k8s.io/template-kind: extra-resource
    cluster.x-k8s.io/cluster-name: cluster
  name: cloud-config
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    capk.cluster.x-k8s.io/template-kind: extra-resource
    cluster.x-k8s.io/cluster-name: cluster
    k8s-app: kubevirt-cloud-controller-manager
  name: kubevirt-cloud-controller-manager
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      capk.cluster.x-k8s.io/template-kind: extra-resource
      cluster.x-k8s.io/cluster-name: cluster
      k8s-app: kubevirt-cloud-controller-manager
  template:
    metadata:
      labels:
        capk.cluster.x-k8s.io/template-kind: extra-resource
        cluster.x-k8s.io/cluster-name: cluster
        k8s-app: kubevirt-cloud-controller-manager
    spec:
      containers:
      - args:
        - --cloud-provider=kubevirt
        - --cloud-config=/etc/cloud/cloud-config
        - --kubeconfig=/etc/kubernetes/kubeconfig/value
        - --authentication-skip-lookup=true
        - --cluster-name="cluster"
        command:
        - /bin/kubevirt-cloud-controller-manager
        image: quay.io/kubevirt/kubevirt-cloud-controller-manager:v0.5.1
        imagePullPolicy: Always
        name: kubevirt-cloud-controller-manager
        resources:
          requests:
            cpu: 100m
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /etc/kubernetes/kubeconfig
          name: kubeconfig
          readOnly: true
        - mountPath: /etc/cloud
          name: cloud-config
          readOnly: true
      nodeSelector:
        node-role.kubernetes.io/master: ""
      serviceAccountName: cloud-controller-manager
      tolerations:
      - effect: NoSchedule
        key: node.cloudprovider.kubernetes.io/uninitialized
        value: "true"
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
      volumes:
      - configMap:
          name: cloud-config
        name: cloud-config
      - name: kubeconfig
        secret:
          secretName: cluster-kubeconfig
